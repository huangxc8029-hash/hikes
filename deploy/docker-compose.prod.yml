# 生产环境：不挂源码、不开放数据库端口、不给后门开关。
# 用法见 docs/DEPLOY.md
name: hikes-prod

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
      # 不挂 docker-entrypoint-initdb.d：建表与升级统一走 alembic。
      # 首次部署执行 `docker compose -f docker-compose.prod.yml exec api alembic upgrade head`
      # （见 docs/DEPLOY.md「二、跑起来」与「迁移台账与升级」）。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    # 不映射端口：只有 api 容器能访问

  api:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      TRUST_PROXY_HEADERS: "1"
      WECHAT_APP_ID: ${WX_APPID}
      WECHAT_APP_SECRET: ${WX_SECRET}
      ROUTE_MEDIA_ROOT: /srv/media/covers
      # 写接口限流阈值（每小时）。留空用代码默认值，口径见 docs/API.md「写接口限流」。
      RATE_LIMIT_COMMENT_PER_IDENTITY_HOUR: ${RATE_LIMIT_COMMENT_PER_IDENTITY_HOUR:-}
      RATE_LIMIT_COMMENT_PER_IP_HOUR: ${RATE_LIMIT_COMMENT_PER_IP_HOUR:-}
      RATE_LIMIT_VISIT_PER_IDENTITY_HOUR: ${RATE_LIMIT_VISIT_PER_IDENTITY_HOUR:-}
      RATE_LIMIT_VISIT_PER_IP_HOUR: ${RATE_LIMIT_VISIT_PER_IP_HOUR:-}
      RATE_LIMIT_REPORT_PER_IDENTITY_HOUR: ${RATE_LIMIT_REPORT_PER_IDENTITY_HOUR:-}
      RATE_LIMIT_REPORT_PER_IP_HOUR: ${RATE_LIMIT_REPORT_PER_IP_HOUR:-}
      # 不给 ALLOW_DEV_LOGIN：生产环境 /api/auth/dev-login 自动返回 404
    volumes:
      - ../app/web:/srv/web:ro
      - ../app/css:/srv/theme:ro
      - ../app:/srv/webapp:ro
      - ../pipeline/out:/srv/routes-data:ro
      - covermedia:/srv/media
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api]

  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -Fc \
          -f /backups/hikes-$$(date +%Y%m%d-%H%M).dump && \
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy

  # V3 保养作业：成绩配对补偿 + 30 天坐标清理。
  # 两个作业每小时各跑一次（配对要跟得上"终点先到、起点后到"的补传，
  # 清理是幂等的便宜查询），每次运行写一行 job_runs 作为台账：
  #   SELECT name, status, started_at, finished_at FROM job_runs ORDER BY started_at DESC LIMIT 5;
  # 失败只影响这一次，容器不退出（作业内的失败会记 failed 并打印堆栈）。
  v3-jobs:
    build:
      context: ../server
    image: hikes-prod-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    entrypoint: >
      sh -c 'while true; do
        python /srv/jobs/reconcile_efforts.py || true;
        python /srv/jobs/purge_visit_coordinates.py || true;
        sleep 3600;
      done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  covermedia:
