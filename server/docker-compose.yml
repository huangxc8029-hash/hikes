name: hikes

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hikes
      POSTGRES_PASSWORD: hikes
      POSTGRES_DB: hikes
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      # 注意：不再挂 docker-entrypoint-initdb.d。
      # 建表统一走 alembic（见 server/migrations/README.md），
      # 空库执行 `docker compose exec api alembic upgrade head`。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hikes -d hikes"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://hikes:hikes@db:5432/hikes
      JWT_SECRET: dev-only-change-me
      ALLOW_DEV_LOGIN: "1"        # 仅本地联调；生产必须去掉
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      # 写接口限流阈值（每小时）。留空用代码默认值：留言 10/30、打卡 60/120、举报 10/30
      # （前者按账号或游客身份，后者按来源 IP）。口径见 docs/API.md「写接口限流」。
      RATE_LIMIT_COMMENT_PER_IDENTITY_HOUR: ${RATE_LIMIT_COMMENT_PER_IDENTITY_HOUR:-}
      RATE_LIMIT_COMMENT_PER_IP_HOUR: ${RATE_LIMIT_COMMENT_PER_IP_HOUR:-}
      RATE_LIMIT_VISIT_PER_IDENTITY_HOUR: ${RATE_LIMIT_VISIT_PER_IDENTITY_HOUR:-}
      RATE_LIMIT_VISIT_PER_IP_HOUR: ${RATE_LIMIT_VISIT_PER_IP_HOUR:-}
      RATE_LIMIT_REPORT_PER_IDENTITY_HOUR: ${RATE_LIMIT_REPORT_PER_IDENTITY_HOUR:-}
      RATE_LIMIT_REPORT_PER_IP_HOUR: ${RATE_LIMIT_REPORT_PER_IP_HOUR:-}
      # 公开读取限流的阈值（默认 120/分钟、2000/小时，被拒 200 次封 60 分钟）。
      # 只在**本地开发**放宽：截图/探针/压测都会反复整页加载，默认值很容易把
      # 自己（同一个来源 IP）关在门外。生产用的 deploy/docker-compose.prod.yml 不设这些，
      # 仍按代码默认值执行 —— 反爬策略不受影响。
      RATE_LIMIT_READ_PER_MINUTE_IP: ${RATE_LIMIT_READ_PER_MINUTE_IP:-600}
      RATE_LIMIT_READ_PER_HOUR_IP: ${RATE_LIMIT_READ_PER_HOUR_IP:-20000}
      RATE_LIMIT_READ_BLOCK_AFTER_TRIPS: ${RATE_LIMIT_READ_BLOCK_AFTER_TRIPS:-2000}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./app:/srv/app:ro
      - ./seeds:/srv/seeds:ro
      - ./db:/srv/db:ro                # 基线修订要按文件名读 001–023
      - ./migrations:/srv/migrations:ro
      - ./alembic.ini:/srv/alembic.ini:ro
      - ../app/js:/srv/route-data:ro   # pipeline 工程化之前，种子数据从已算好的产物读
      - ../app/web:/srv/web:ro         # 真实页面（同源，免 CORS）
      - ../app/css:/srv/theme:ro       # 前端设计令牌与样式（同一份，不复制）
      - ../pipeline/out:/srv/routes-data:ro   # pipeline 生成的分级结果
      - ../pipeline:/srv/pipeline:ro          # 给山顶找名字的脚本要在这里跑
      - ../app:/srv/webapp:ro                 # app/index.html 原型（接后端用）
      - ./media:/srv/media                    # 本机开发封面；生产必须换持久化存储
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  dbdata:
