<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>确认邮箱 · 到此一游</title><link rel="stylesheet" href="/app/css/app.css"><body style="max-width:520px;margin:12vh auto;padding:24px"><main class="card"><h1>确认邮箱</h1><p id="status">正在确认邮箱…</p><a id="back" href="/app/">返回到此一游</a></main><script>
(function(){var p=document.getElementById('status'),t=new URLSearchParams(location.search).get('token');if(!t){p.textContent='验证链接缺少令牌，请从邮件重新打开。';return;}var guest='';try{guest=localStorage.getItem('hikes.guest.token')||'';}catch(e){}fetch('/api/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json','X-Guest-Token':guest},body:JSON.stringify({token:t})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error((d.detail&&d.detail.error&&d.detail.error.message)||'验证失败');return d;});}).then(function(d){localStorage.setItem('hikes.auth.token',d.token);localStorage.setItem('hikes.auth.userId',String(d.userId));p.textContent='邮箱验证成功，账号已登录。正在返回…';setTimeout(function(){location.href='/app/#/me';},1000);}).catch(function(e){p.textContent=e.message;var f=document.createElement('div');f.innerHTML='<p>如需重新发送验证邮件，请填写注册邮箱：</p><input id="resendEmail" type="email" placeholder="邮箱地址" style="padding:10px;width:100%;box-sizing:border-box"><button id="resend" style="margin-top:10px;padding:10px">重新发送</button>';document.querySelector('main .card').appendChild(f);document.getElementById('resend').onclick=function(){fetch('/api/auth/resend-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('resendEmail').value})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error((d.detail&&d.detail.error&&d.detail.error.message)||'发送失败');return d})}).then(function(){p.textContent='如果该邮箱需要验证，邮件已发送，请查收。'}).catch(function(x){p.textContent=x.message})};});})();
</script></body></html>
