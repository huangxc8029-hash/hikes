<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台角色管理 · 到此一游</title><link rel="stylesheet" href="/app/css/app.css"><style>body{max-width:900px;margin:30px auto;padding:16px;color:#20322b}.toolbar{display:flex;gap:8px;margin:16px 0}.toolbar input{flex:1;padding:10px;border:1px solid #cdd7d1;border-radius:8px}.user{padding:14px;margin:10px 0}.muted{color:#617268;font-size:13px}.roles{margin:8px 0}.role{display:inline-block;background:#e8f1ea;padding:4px 8px;border-radius:12px;margin:3px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions select,.actions input{padding:8px;border:1px solid #cdd7d1;border-radius:7px}.error{color:#a43b31}</style></head><body>
<main><a href="/app/">← 回到产品</a><h1>平台角色管理</h1><p class="muted">仅平台管理员可访问。此处只授予审核类系统角色；山头负责人与版主通过申请审核获得范围权限。</p><p id="msg" class="muted">请先登录平台管理员账号。</p><div class="toolbar"><input id="q" placeholder="搜索用户名、昵称或邮箱"><button id="search" class="btn coral">搜索</button></div><section id="users"></section></main>
<script>
(function(){var roles=[['ad_reviewer','广告审核员'],['place_curator','地理资料审核员'],['collaboration_reviewer','协作申请审核员'],['content_reviewer','留言申诉审核员']];var box=document.getElementById('users'),msg=document.getElementById('msg');function token(){try{return localStorage.getItem('hikes.auth.token')||''}catch(e){return''}}function call(url,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+token(),'Content-Type':'application/json'},opt.headers||{});return fetch(url,opt).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error((d.detail&&d.detail.error&&d.detail.error.message)||'请求失败');return d})})}function load(){msg.textContent='加载中…';call('/api/platform-admin/users?q_text='+encodeURIComponent(document.getElementById('q').value)).then(function(items){msg.textContent='账号 '+items.length+' 个';box.innerHTML=items.map(function(u){var existing=(u.roles||[]).map(function(r){return r.role});return '<article class="card user"><b>'+esc(u.nickname||u.username||('用户 '+u.id))+'</b> <span class="muted">#'+u.id+' · '+esc(u.username||'')+' · '+esc(u.email||'未留邮箱')+' · '+(u.email_verified_at?'已验证':'未验证')+'</span><div class="roles">'+(u.roles||[]).map(function(r){return '<span class="role">'+esc(r.roleName||r.role)+'</span>'}).join('')+'</div><div class="actions"><select data-role>'+roles.map(function(r){return '<option value="'+r[0]+'">'+r[1]+'</option>'}).join('')+'</select><input data-reason placeholder="填写授权/撤销理由（至少4字）"><button class="btn coral mini" data-grant="'+u.id+'">授予</button><button class="btn ghost mini" data-revoke="'+u.id+'">撤销</button></div></article>'}).join('')}).catch(function(e){msg.className='error';msg.textContent=e.message;box.innerHTML=''})}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}box.addEventListener('click',function(e){var id=e.target.getAttribute('data-grant')||e.target.getAttribute('data-revoke');if(!id)return;var card=e.target.closest('.user'),role=card.querySelector('[data-role]').value,reason=card.querySelector('[data-reason]').value.trim();if(reason.length<4){alert('请填写至少4字的操作理由');return}var grant=e.target.hasAttribute('data-grant');call('/api/platform-admin/roles',{method:grant?'POST':'DELETE',body:JSON.stringify({userId:Number(id),role:role,reason:reason})}).then(load).catch(function(x){alert(x.message)})});document.getElementById('search').onclick=load;load()})();
</script></body></html>
